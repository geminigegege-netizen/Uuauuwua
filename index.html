<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ミニ・タワーディフェンス</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #e0f7fa; }
        #field {
            width: 600px;
            height: 200px;
            background: #ffffff;
            border: 3px solid #333;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
        }
        .unit {
            position: absolute;
            bottom: 20px;
            font-size: 30px;
        }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>ミニ・タワーディフェンス</h1>
    <p>「味方出撃」を押して敵を倒そう！</p>
    
    <div id="field"></div>

    <button onclick="spawnAlly()">味方出撃！ 🐈</button>
    <button onclick="spawnEnemy()">敵出現！ 🦍</button>

    <script>
        const field = document.getElementById('field');

        // 味方（ネコ）を出す関数
        function spawnAlly() {
            const ally = document.createElement('div');
            ally.className = 'unit';
            ally.textContent = '🐈';
            let pos = 0;
            ally.style.left = pos + 'px';
            field.appendChild(ally);

            // 右へ進む
            const timer = setInterval(() => {
                pos += 2;
                ally.style.left = pos + 'px';

                // 画面の真ん中あたり（300px）で止まる（敵と戦うイメージ）
                if (pos >= 280) {
                    clearInterval(timer);
                    ally.textContent = '⚔️🐈'; // 戦闘中ぽくする
                }
            }, 30);
        }

        // 敵（ゴリラ）を出す関数
        function spawnEnemy() {
            const enemy = document.createElement('div');
            enemy.className = 'unit';
            enemy.textContent = '🦍';
            let pos = 550;
            enemy.style.left = pos + 'px';
            field.appendChild(enemy);

            // 左へ進む
            const timer = setInterval(() => {
                pos -= 2;
                enemy.style.left = pos + 'px';

                // 真ん中あたりで止まる
                if (pos <= 320) {
                    clearInterval(timer);
                    enemy.textContent = '🦍⚔️';
                }
            }, 30);
        }
    </script>

</body>
</html>
